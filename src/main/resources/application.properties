# Committed configuration – safe defaults only, NO secrets.
# Every value can be overridden by an environment variable (servers, Docker, CI) or by a local,
# gitignored file next to pom.xml: application-local.properties (see .env.example for all keys).
spring.application.name=backend
spring.config.import=optional:file:./application-local.properties

server.port=${PORT:8080}
# Take the client IP from X-Forwarded-For only when it comes from a private-network proxy (the
# hosting load balancer), so rate limits see real client IPs and clients cannot spoof the header
server.forward-headers-strategy=native
server.error.include-stacktrace=never
server.error.include-message=never

# ==============================
# Database
# ==============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gmc_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==============================
# JWT (Base64 secret, at least 256 bits: `openssl rand -base64 48`)
# ==============================
jwt.secret=${JWT_SECRET:}

# ==============================
# App settings
# ==============================
app.refresh-token-days=${REFRESH_TOKEN_DAYS:7}
app.upload-dir=${UPLOAD_DIR:uploads/}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Mark the refresh-token cookie Secure (set true wherever the site is served over HTTPS)
app.cookie.secure=${COOKIE_SECURE:false}

# Where the React app runs; used to build the link in password-reset emails
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset.token-minutes=${PASSWORD_RESET_TOKEN_MINUTES:30}

# ==============================
# Email (SMTP)
# Spring only turns email on when spring.mail.host is set, so the host is deliberately NOT
# defined here: without it, email content (including reset links) is logged instead of sent.
# To send for real set SPRING_MAIL_HOST (env var) or spring.mail.host (application-local.properties).
# Gmail: create an App Password at https://myaccount.google.com/apppasswords.
# ==============================
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# The "From" address; with Gmail this should be the same as the mail username
app.mail.from=${MAIL_FROM:no-reply@gmclanka.com}

# ==============================
# Checkout pricing (used for every order and for the amount charged by card)
# ==============================
# VAT as a fraction: 0.15 = 15%
app.checkout.tax-rate=${CHECKOUT_TAX_RATE:0.15}
# Flat delivery fee in LKR
app.checkout.shipping-fee=${CHECKOUT_SHIPPING_FEE:1200}
# Free delivery when the items subtotal reaches this amount (0 = never free)
app.checkout.free-shipping-threshold=${CHECKOUT_FREE_SHIPPING_THRESHOLD:0}
# Card orders still unpaid after this many minutes are cancelled and their stock released
app.checkout.unpaid-order-expiry-minutes=${CHECKOUT_UNPAID_ORDER_EXPIRY_MINUTES:60}

# ==============================
# Stripe card payments (empty = card payments hidden, cash on delivery only)
# ==============================
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=${STRIPE_CURRENCY:lkr}
