# ==============================
# Checkout pricing (used for every order and for the amount charged by card)
# ==============================
# VAT as a fraction: 0.15 = 15%
app.checkout.tax-rate=0.15
# Flat delivery fee in LKR
app.checkout.shipping-fee=1200
# Free delivery when the items subtotal reaches this amount (0 = never free)
app.checkout.free-shipping-threshold=0
# Card orders still unpaid after this many minutes are cancelled and their stock released
app.checkout.unpaid-order-expiry-minutes=60

# ==============================
# Stripe card payments
# Keys: Stripe Dashboard -> Developers -> API keys (use the TEST keys while developing).
# While these are empty, "Card" is hidden at checkout and only Cash on Delivery is offered.
# NEVER commit the secret key (sk_...) to git or put it in the frontend.
# ==============================
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
# From `stripe listen` (local testing) or Dashboard -> Developers -> Webhooks (deployed site)
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=lkr