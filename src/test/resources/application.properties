spring.application.name=backend

# Tests never use real credentials. Locally they run on an in-memory H2 database;
# CI provides DB_URL / DB_USERNAME / DB_PASSWORD for its MySQL service.
spring.datasource.url=${DB_URL:jdbc:h2:mem:gmc_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=create-drop
# Quote names like "date" that are reserved words in H2
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

