# CI/CD pipeline for the GMC Lanka backend (SENG 34213 guideline, section 7.2)
#
# The stages (lint, build, unit tests, integration tests, security scan, staging and production
# deploys) are defined once in the infra repository:
#   https://github.com/test-gmc-lanka/infra/blob/main/.github/workflows/backend-ci.yml
# This file only decides when the pipeline runs and what it is allowed to do.
name: CI/CD Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline
    uses: test-gmc-lanka/infra/.github/workflows/backend-ci.yml@main
    # Upper bound for the called jobs: deploys push images (packages) and create release tags (contents)
    permissions:
      contents: write
      packages: write
    secrets: inherit
