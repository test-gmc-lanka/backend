name: CI Pipeline

on:
  push:
    branches: [ develop, main, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ develop, main ]

jobs:
  # ── Stage 1: Lint & Format Check ──────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        run: mvn -B checkstyle:check --no-transfer-progress

  # ── Stage 2: Build ────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn -B validate compile --no-transfer-progress

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: classes
          path: target/classes/

  # ── Stage 3: Unit Tests ───────────────────────────────────
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # TODO: Remove continue-on-error once real tests are written (Sprint 6+)
      - name: Run unit tests
        run: mvn -B test -Dspring.profiles.active=test --no-transfer-progress
        continue-on-error: true

      - name: Generate JaCoCo coverage report
        run: mvn -B jacoco:report --no-transfer-progress
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/

      # TODO: Remove continue-on-error once coverage reaches 80% (Sprint 6+)
      - name: Check coverage gate (>= 80%)
        run: mvn -B jacoco:check --no-transfer-progress
        continue-on-error: true

  # ── Stage 4: Integration Tests (develop only) ─────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.ref == 'refs/heads/develop' ||
      (github.event_name == 'pull_request' && github.base_ref == 'develop')

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: gmc_test_db
          MYSQL_ROOT_PASSWORD: testroot
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # TODO: Remove continue-on-error once integration tests are written (Sprint 6+)
      - name: Run integration tests
        run: mvn -B verify -Dspring.profiles.active=test --no-transfer-progress
        continue-on-error: true
        env:
          DB_URL: jdbc:mysql://localhost:3306/gmc_test_db
          DB_USERNAME: root
          DB_PASSWORD: testroot