name: CI Pipeline

on:
  push:
    branches: [ develop, main, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ develop, main ]

jobs:
  # ── Stage 1: Build & Lint ──────────────────────────────────
  build:
    name: Build & Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & run Checkstyle
        run: mvn -B validate compile checkstyle:check --no-transfer-progress

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: classes
          path: target/classes/

  # ── Stage 2: Unit & Integration Tests ─────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: gmc_test_db
          MYSQL_ROOT_PASSWORD: testroot
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn -B test -Dspring.profiles.active=test --no-transfer-progress

      - name: Run integration tests
        run: mvn -B verify -Dspring.profiles.active=test --no-transfer-progress
        env:
          DB_URL: jdbc:mysql://localhost:3306/gmc_test_db
          DB_USERNAME: root
          DB_PASSWORD: testroot

      - name: Generate JaCoCo coverage report
        run: mvn -B jacoco:report --no-transfer-progress

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/

      - name: Check coverage gate (≥ 80%)
        run: mvn -B jacoco:check --no-transfer-progress

  # ── Stage 3: Security Scan ─────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: OWASP Dependency Check
        run: mvn -B org.owasp:dependency-check-maven:check
          -DfailBuildOnCVSS=8
          --no-transfer-progress

  # ── Stage 4: Deploy to Staging ────────────────────────────
  deploy-staging:
    name: Deploy – Staging
    runs-on: ubuntu-latest
    needs: [ test, security ]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build production JAR
        run: mvn -B package -DskipTests --no-transfer-progress

      - name: Build & push Docker image
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t gmclanka/backend:staging-${{ github.sha }} .
          docker push gmclanka/backend:staging-${{ github.sha }}

      - name: Deploy to staging
        run: echo "Deploy step – configure with your hosting provider (Railway/Render/EC2)"
        # TODO: Replace with your actual deployment command, e.g.:
        # uses: JorgeLNJunior/render-deploy@v1.4.4
        # with:
        #   service_id: ${{ secrets.RENDER_SERVICE_ID }}
        #   api_key: ${{ secrets.RENDER_API_KEY }}

  # ── Stage 5: Deploy to Production ─────────────────────────
  deploy-production:
    name: Deploy – Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production   # Requires manual approval in GitHub Environments
    steps:
      - uses: actions/checkout@v4
      - name: Deploy tagged release to production
        run: echo "Production deploy – configure after staging is stable"
